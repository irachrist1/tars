name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test (packager + indexer + CLI)
        run: npm test

  install-sh:
    name: install.sh shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX syntax check
        run: sh -n install.sh
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck -S warning install.sh || true
